# Supabase CLI config. `supabase init` generates a fuller version; keep this minimal.
# https://supabase.com/docs/guides/cli/config

project_id = "geo-studio"

[api]
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.sms]
enable_signup = true
enable_confirmations = true
